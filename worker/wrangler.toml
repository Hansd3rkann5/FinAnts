name = "finants-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Secrets are set via:
#   wrangler secret put FINTS_BLZ
#   wrangler secret put FINTS_USERNAME
#   wrangler secret put FINTS_PIN
#   wrangler secret put FINTS_IBAN       (optional – falls back to first account)
#   wrangler secret put API_KEY          (random string to protect the endpoint)

[vars]
# Replace with your actual GitHub Pages URL after deploying
ALLOWED_ORIGIN = "*"

[[r2_buckets]]
binding = "ICONS"
bucket_name = "finants-icons"

[[d1_databases]]
binding = "DB"
database_name = "finants-db"
database_id = "05a996af-64ac-4d63-86e9-13e57b649f6d"
